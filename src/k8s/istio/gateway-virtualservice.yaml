apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: perfumes-gateway
  namespace: perfumes
  labels:
    app: perfumes-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: perfumes-api
  namespace: perfumes
spec:
  hosts:
    - "*"
  gateways:
    - perfumes-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: perfumes-api
            port:
              number: 80
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure,refused-stream
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: perfumes-api
  namespace: perfumes
spec:
  host: perfumes-api
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
  subsets:
    - name: v2
      labels:
        version: v2
