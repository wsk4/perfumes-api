apiVersion: v1
kind: Service
metadata:
  name: perfumes-api
  namespace: perfumes
  labels:
    app: perfumes-api
spec:
  type: ClusterIP
  selector:
    app: perfumes-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: perfumes
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: tcp-redis
      protocol: TCP
      port: 6379
      targetPort: redis
