apiVersion: v1
kind: Namespace
metadata:
  name: perfumes
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perfumes-api
  namespace: perfumes
  labels:
    app: perfumes-api
    version: v2
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: perfumes-api
  template:
    metadata:
      labels:
        app: perfumes-api
        version: v2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: perfumes-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              value: "2.0.1"
            - name: REDIS_URL
              value: redis://redis:6379
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: perfumes
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server"]
          args: ["--appendonly", "no", "--save", ""]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
              ephemeral-storage: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
