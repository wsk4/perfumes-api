name: EP3 CI/CD - Perfumes API (K8s + Istio + Observabilidad)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.25.0"
  IMAGE_NAME: ghcr.io/moonlighpoio/perfumes-api
  ISTIO_VERSION: "1.24.4"
  KIND_VERSION: "v0.24.0"

jobs:
  # -------------------------------------------------------------------------
  # 1. Calidad: lint + pruebas unitarias + umbral de cobertura
  # -------------------------------------------------------------------------
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Ejecutar ESLint
        run: pnpm lint

      - name: Ejecutar pruebas con cobertura (umbral bloqueante)
        run: pnpm test:ci

      - name: Publicar métricas de calidad (IE3)
        if: always()
        run: |
          {
            echo "## Métricas de calidad"
            echo "| Métrica | Valor |"
            echo "|---|---|"
            echo "| Cobertura de líneas | $(jq -r '.total.lines.pct' coverage/coverage-summary.json 2>/dev/null || echo 'n/d')% |"
            echo "| Cobertura de ramas | $(jq -r '.total.branches.pct' coverage/coverage-summary.json 2>/dev/null || echo 'n/d')% |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cobertura-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------------------
  # 2. Seguridad: audit de dependencias + Snyk (si hay token)
  # -------------------------------------------------------------------------
  security:
    name: Seguridad
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Auditar dependencias de producción (bloqueante)
        run: pnpm audit --prod --audit-level=high

      - name: Análisis con Snyk (si SNYK_TOKEN está configurado)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "::warning title=Snyk omitido::SNYK_TOKEN no está configurado. Se mantienen activos pnpm audit y Trivy."
            exit 0
          fi
          npm install -g --ignore-scripts snyk@1.1308.3
          snyk test --prod --severity-threshold=high --all-projects

          # Snyk Code (SAST) requiere que la organización lo tenga habilitado.
          # Si no está activo, se advierte pero no se bloquea el pipeline:
          # Snyk Open Source y Trivy siguen siendo gates obligatorios.
          set +e
          code_output=$(snyk code test --severity-threshold=high 2>&1)
          code_status=$?
          set -e
          echo "$code_output"
          if [ "$code_status" -ne 0 ]; then
            if echo "$code_output" | grep -q "Snyk Code is not enabled"; then
              echo "::warning title=Snyk Code no habilitado::Activa Snyk Code en la organización para el análisis SAST. Snyk Open Source y Trivy siguen bloqueando."
            else
              exit "$code_status"
            fi
          fi

  # -------------------------------------------------------------------------
  # 3. Imagen: build + escaneo de vulnerabilidades + push a GHCR
  # -------------------------------------------------------------------------
  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs:
      - quality
      - security
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Definir tag inmutable (SHA del commit)
        id: meta
        run: echo "tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Construir imagen
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Escanear imagen con Trivy (bloqueante)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Subir resultados de seguridad a GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Guardar imagen como artefacto
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o image.tar

      - name: Publicar artefacto de imagen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perfumes-api-image
          path: image.tar
          if-no-files-found: error
          retention-days: 7

      - name: Publicar imagen en GHCR
        id: publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          else
            docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi

      - name: Advertir si GHCR no está habilitado
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning title=GHCR::No se pudo publicar la imagen. Habilita 'Read and write permissions' en Settings > Actions > General."
          echo "El despliegue continuará usando el artefacto inmutable de este run."

  # -------------------------------------------------------------------------
  # 4. Despliegue en Kubernetes (kind) con Istio + observabilidad (EP3)
  #    Reproduce en CI el mismo entorno que se documenta en docs/ep3-observabilidad.md
  # -------------------------------------------------------------------------
  deploy:
    name: Despliegue K8s + Istio
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    timeout-minutes: 35

    permissions:
      contents: read

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: http://localhost:3000

    env:
      IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Descargar imagen construida
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: perfumes-api-image

      - name: Cargar imagen en Docker
        run: docker load -i image.tar

      - name: Desplegar cluster + Istio + observabilidad
        run: |
          START=$(date +%s)
          bash scripts/k8s-local.sh "${IMAGE_TAG}"
          echo "DEPLOY_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Publicar métricas de despliegue (IE3)
        if: always()
        run: |
          {
            echo "## Métricas de despliegue"
            echo "| Métrica | Valor |"
            echo "|---|---|"
            echo "| Tiempo de despliegue | ${DEPLOY_SECONDS:-n/d} s |"
            echo "| Réplicas de la API | $(kubectl -n perfumes get deploy perfumes-api -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo n/d) |"
            echo "| Estado mTLS | $(kubectl -n perfumes get peerauthentication default -o jsonpath='{.spec.mtls.mode}' 2>/dev/null || echo n/d) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Evidencias de observabilidad
        if: always()
        run: |
          echo "--- Pods ---"
          kubectl -n perfumes get pods -o wide || true
          echo "--- Servicios de la malla ---"
          kubectl -n istio-system get pods || true
          echo "--- Análisis de Istio ---"
          istio-${ISTIO_VERSION}/bin/istioctl analyze -n perfumes || true

      - name: Mostrar logs si falla
        if: failure()
        run: |
          kubectl -n perfumes logs -l app=perfumes-api --all-containers --tail=100 || true
          kubectl -n perfumes logs -l app=redis --all-containers --tail=100 || true
          kubectl -n perfumes describe pods || true
          kubectl -n istio-system logs deploy/istio-ingressgateway --tail=50 || true

      - name: Detener entorno
        if: always()
        run: kind delete cluster --name ep3 || true

  # -------------------------------------------------------------------------
  # 5. Release/tag automático en main (trazabilidad versión -> commit)
  # -------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Crear tag y release si no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Perfumes API $TAG" \
              --generate-notes
          fi

  # -------------------------------------------------------------------------
  # 6. Despliegue real en EC2 (AWS): k3s + Istio + observabilidad vía SSM
  # -------------------------------------------------------------------------
  deploy-aws:
    name: Despliegue en EC2 (k3s + Istio)
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main' && vars.ENABLE_AWS_DEPLOY == 'true'
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Desplegar en EC2 mediante SSM
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"dnf install -y git tar gzip\",
              \"curl -fsSL https://raw.githubusercontent.com/Moonlighpoio/perfumes-api/main/scripts/deploy-ec2.sh -o /tmp/deploy-ec2.sh\",
              \"bash /tmp/deploy-ec2.sh ${IMAGE_NAME}:${GITHUB_SHA}\"
            ]" \
            --region "${AWS_REGION}" \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: ${COMMAND_ID}"
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${EC2_INSTANCE_ID}" --region "${AWS_REGION}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --region "${AWS_REGION}" \
            --query 'Status' \
            --output text)

          echo "Estado final: ${STATUS}"
          if [ "${STATUS}" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
